name: TTS bake-off
on:
  push:
    paths: ["scripts/tts/**", ".github/workflows/tts-bakeoff.yml"]
  workflow_dispatch:
jobs:
  tts:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        engine: [kokoro, chatterbox, turbo, qwen]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Install
        run: |
          sudo apt-get install -y -qq espeak-ng ffmpeg > /dev/null 2>&1 || true
          pip install -q soundfile numpy
          case "${{ matrix.engine }}" in
            kokoro) pip install -q "kokoro>=0.9" ;;
            chatterbox|turbo) pip install -q chatterbox-tts ;;
            qwen) pip install -q -U qwen-tts ;;
          esac
      - name: Reference voice for turbo (our own Kokoro voice, no real person)
        if: matrix.engine == 'turbo'
        run: |
          pip install -q "kokoro>=0.9"
          python -c "from kokoro import KPipeline;import numpy as np,soundfile as sf;p=KPipeline(lang_code='a');a=np.concatenate([x for _,_,x in p('Alright, welcome back to the channel. Today we are jumping straight into GTA six, and trust me, this one gets wild very fast. Let us go!',voice='am_michael')]);sf.write('ref.wav',a,24000)"
      - name: Generate
        run: python scripts/tts/bake.py ${{ matrix.engine }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tts-${{ matrix.engine }}
          path: out/
          retention-days: 1
