name: TTS check
on:
  push:
    paths: ["scripts/tts/check.py"]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -q faster-whisper librosa soundfile
      - env:
          GH_TOKEN: ${{ github.token }}
        run: mkdir aud && gh release download tts-bakeoff -D aud -R ${{ github.repository }} && python scripts/tts/check.py
